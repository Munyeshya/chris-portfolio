name: Deploy Aiven MySQL migrations

on:
  push:
    branches: [main]
    paths:
      - 'migrations/mysql/**'
      - 'server/migrate.js'
      - '.github/workflows/aiven-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply pending MySQL migrations
        run: npm run migrate
        env:
          AIVEN_MYSQL_URI: ${{ secrets.AIVEN_MYSQL_URI }}
          AIVEN_CA_CERT_BASE64: ${{ secrets.AIVEN_CA_CERT_BASE64 }}
      - name: Ensure initial administrator exists
        run: npm run create-admin
        env:
          AIVEN_MYSQL_URI: ${{ secrets.AIVEN_MYSQL_URI }}
          AIVEN_CA_CERT_BASE64: ${{ secrets.AIVEN_CA_CERT_BASE64 }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
