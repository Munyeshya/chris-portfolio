<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0c" />
    <link rel="icon" type="image/png" href="../brand/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    <title>Portal Coming Soon | Lions Entertainment</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; color: #fff; background: radial-gradient(circle at 50% 30%, #351010, #0c0c0c 58%); font-family: Montserrat, Arial, sans-serif; }
      main { width: min(680px, 100%); text-align: center; }
      img { width: clamp(250px, 42vw, 360px); height: auto; margin: 0 auto -16px; }
      p { margin: 0 0 18px; color: #e14848; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(42px, 9vw, 88px); line-height: .95; letter-spacing: -.04em; }
      .message { margin: 25px auto 36px; max-width: 530px; color: #bbb; font-size: 15px; line-height: 1.8; letter-spacing: 0; text-transform: none; font-weight: 400; }
      a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 14px 22px; color: #fff; text-decoration: none; background: rgba(255,255,255,.12); box-shadow: inset 0 1px rgba(255,255,255,.28), 0 12px 30px #0006; backdrop-filter: blur(14px); }
      a:hover { background: #c41b1b; }
    </style>
  </head>
  <body>
    <main>
      <img src="../brand/lions-ent-white.png" alt="Lions Entertainment" />
      <p>Registration &amp; Booking Portal</p>
      <h1>Coming Soon</h1>
      <p class="message">We’re building a simpler way to register, book, and connect with Lions Entertainment. Please check back soon.</p>
      <a href="../">Return to the website</a>
    </main>
  </body>
</html>
